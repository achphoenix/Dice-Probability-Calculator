<div class="calculator-container">
  <div class="left-column">
    <div class="input-group">
      <label for="dice-count">Number of Dice:</label>
      <select 
        id="dice-count" 
        [value]="calculatorService.diceCount()"
        (change)="onDiceCountChange($any($event.target).value)">
        <option *ngFor="let count of diceCountOptions" [value]="count">{{ count }}</option>
      </select>
    </div>

    <div class="input-group">
      <label for="dice-type">Dice Type:</label>
      <select 
        id="dice-type"
        [value]="calculatorService.diceType() ?? ''"
        (change)="onDiceTypeChange($any($event.target).value)">
        <option value="" disabled>Select di(c)e</option>
        <option *ngFor="let option of diceOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>

    <div class="input-group dice-list-controls">
      <button 
        class="add-dice-button"
        (click)="addDiceToList()"
        [disabled]="!canAddDice()"
        title="Add current dice selection to the list">
        Add to List
      </button>
      <button 
        class="clear-dice-button"
        (click)="clearDiceList()"
        [disabled]="calculatorService.diceGroups().length === 0"
        title="Clear all dice from the list">
        Clear List
      </button>
    </div>

    <div class="dice-list" *ngIf="calculatorService.diceGroups().length > 0">
      <div class="dice-list-header">Mixed Dice:</div>
      <div class="dice-list-items">
        <div class="dice-item" *ngFor="let group of calculatorService.diceGroups()">
          <span class="dice-label">{{ getDiceGroupLabel(group.count, group.type) }}</span>
          <button 
            class="remove-dice-button" 
            (click)="removeDiceGroup(group.id)"
            title="Remove this dice group">
            ×
          </button>
        </div>
      </div>
    </div>

    <div class="input-group">
      <label for="modifier">Modifier (Optional):</label>
      <input 
        type="text" 
        id="modifier"
        [value]="calculatorService.modifier() || ''"
        (input)="onModifierChange($any($event.target).value)"
        placeholder="e.g., +5 or -2">
    </div>

    <app-probability-table 
      [results]="calculatorService.probabilityResults()"
      [goalNumber]="calculatorService.goalNumber()"
      [goalComparison]="calculatorService.goalComparison()"></app-probability-table>
  </div>

  <div class="right-column">
    <div class="input-group">
      <label for="goal-number">Goal (Optional):</label>
      <input 
        type="text" 
        id="goal-number"
        [value]="calculatorService.goalNumber() ?? ''"
        (input)="onGoalNumberChange($any($event.target).value)"
        placeholder="Optional">
    </div>

    <div class="input-group" *ngIf="calculatorService.goalNumber() !== null">
      <label for="goal-comparison">Goal Comparison:</label>
      <select 
        id="goal-comparison"
        [value]="calculatorService.goalComparison()"
        (change)="onGoalComparisonChange($any($event.target).value)">
        <option *ngFor="let option of goalComparisonOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>

    <div class="input-group roll-mode-group">
      <label for="roll-mode">Roll Mode:</label>
      <div class="roll-mode-controls">
        <div class="pill-toggle" 
             (click)="cycleRollMode()" 
             [attr.data-mode]="calculatorService.rollMode()"
             [title]="getRollModeLabel()">
          <span class="pill-label pill-label-left">N</span>
          <span class="pill-label pill-label-center">A</span>
          <span class="pill-label pill-label-right">D</span>
          <div class="pill-circle">
            <span class="pill-icon">{{ getRollModeIcon() }}</span>
          </div>
        </div>
        <div class="roll-mode-info">
          <span class="roll-mode-text">{{ getRollModeLabel() }}</span>
          <span class="info-icon" title="">ⓘ
            <span class="info-tooltip">
              <strong>Normal Roll:</strong> Roll the dice once and use the result.<br><br>
              <strong>Advantage:</strong> Roll twice and use the higher result.<br><br>
              <strong>Disadvantage:</strong> Roll twice and use the lower result.
            </span>
          </span>
        </div>
      </div>
    </div>

    <app-goal-result [goalResult]="calculatorService.goalResult()"></app-goal-result>
  </div>
</div>
